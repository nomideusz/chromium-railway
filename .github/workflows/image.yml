# Builds the image the Railway template deploys, so a deploy pulls a finished image instead of
# building on Railway's builders. Each push to main gets ghcr.io/<this repo>:<short sha>; point
# template-config.json at it, then republish.
name: Image
on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "template-*.json", "zeabur-template.yaml", "images/**"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    if: github.repository_owner == 'two-workspaces'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository }}:${{ env.SHORT_SHA }},ghcr.io/${{ github.repository }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
