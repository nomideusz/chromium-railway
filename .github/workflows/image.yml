# Builds the image the Dockerfile on main is FROM, so a deploy pulls a finished image instead of
# doing a full build on Railway. Each push to the image branch gets ghcr.io/<this repo>:<short sha>.
# It runs there and not on main because every push to main notifies deployers: point main's
# Dockerfile at the new tag in the one push that ships it.
name: Image
on:
  push:
    branches: [image]
    paths-ignore: ["README.md", "template-*.json", "zeabur-template.yaml", "images/**"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    if: github.repository_owner == 'two-workspaces'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.image
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository }}:${{ env.SHORT_SHA }},ghcr.io/${{ github.repository }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
